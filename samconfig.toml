version = 0.1

[default.build.parameters]
use_container = true

[default.deploy.parameters]
stack_name = "semblance"
region = "eu-west-1"  # Ireland
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
disable_rollback = false
# Secrets are never committed here — passed via --parameter-overrides from
# GitHub Actions secrets (see .github/workflows/semblance.yml) or typed in
# by hand on `sam deploy --guided` for a first local deploy.
