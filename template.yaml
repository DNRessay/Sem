AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SEMBLANCE — personal AI assistant. Light tier (chat, Lambda Function URL)
  + Medium tier (scheduled KAIROS tick). No API Gateway (avoids its 12-month
  free-tier cliff), no NAT gateway, no always-on compute — designed to cost
  a few rand a month for a single user.

Parameters:
  GroqApiKey:
    Type: String
    NoEcho: true
  GroqModel:
    Type: String
    Default: qwen/qwen3.8-27b
  GroqPlanningModel:
    Type: String
    Default: openai/gpt-oss-120b
  NeonDatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon Postgres connection string, e.g. postgresql://user:pass@host/db?sslmode=require
  ModalEmbeddingsUrl:
    Type: String
    Default: ""
    Description: URL of the deployed Modal embeddings endpoint (modal_app/embeddings.py)
  ModalRepoUrl:
    Type: String
    Default: ""
    Description: URL of the deployed Modal persistent repo clone/read/grep endpoint (modal_app/repo_tool.py)
  ModalRepoSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Shared secret sent as Bearer auth to ModalRepoUrl — must match the Modal secret's REPO_TOOL_SECRET value
  SecretKey:
    Type: String
    NoEcho: true
    Description: Shared secret the frontend sends as x-api-key for BYPASS trust mode
  SerpApiKey:
    Type: String
    NoEcho: true
    Default: ""
  WhatsappToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Meta Graph API access token for the WhatsApp Business Cloud API (outbound sends)
  WhatsappPhoneId:
    Type: String
    Default: ""
    Description: WhatsApp Business phone number ID, from the Meta App Dashboard
  WhatsappVerifyToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Arbitrary string also entered in the Meta App Dashboard's webhook Verify Token field
  OpenclawUrl:
    Type: String
    Default: ""
    Description: Optional self-hosted OpenClaw gateway URL (WhatsApp/Telegram bridge)
  McpServers:
    Type: String
    Default: ""
    Description: >
      Optional JSON object of name -> base_url registered with the "mcp" tool at startup,
      e.g. {"slack": "https://my-slack-mcp.example.com"}
  GithubClientId:
    Type: String
    Default: ""
    Description: GitHub OAuth App client ID (github.com/settings/developers) — blank disables GitHub OAuth, manual PAT paste still works
  GithubClientSecret:
    Type: String
    NoEcho: true
    Default: ""
  GitlabClientId:
    Type: String
    Default: ""
    Description: GitLab OAuth App client ID (gitlab.com/-/user_settings/applications) — blank disables GitLab OAuth, manual PAT paste still works
  GitlabClientSecret:
    Type: String
    NoEcho: true
    Default: ""
  PublicApiUrl:
    Type: String
    Default: ""
    Description: >
      This stack's own ChatFunctionUrl value (same as the frontend's VITE_API_URL) — needed to build
      the exact OAuth redirect_uri. Can't be !GetAtt'd here: that would be a circular reference on the
      same resource whose Environment this sets, so it's a plain parameter carrying the already-known
      Function URL instead.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]  # matches GitHub Actions runners natively — arm64/Graviton
                              # needs cross-arch container emulation (QEMU) in CI, which
                              # GitHub-hosted runners don't reliably have; not worth the
                              # ~20% compute saving when usage is already ~$0/month
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        GROQ_API_KEY: !Ref GroqApiKey
        GROQ_MODEL: !Ref GroqModel
        GROQ_PLANNING_MODEL: !Ref GroqPlanningModel
        NEON_DATABASE_URL: !Ref NeonDatabaseUrl
        MODAL_EMBEDDINGS_URL: !Ref ModalEmbeddingsUrl
        MODAL_REPO_URL: !Ref ModalRepoUrl
        MODAL_REPO_SECRET: !Ref ModalRepoSecret
        CACHE_TABLE_NAME: !Ref CacheTable
        SECRET_KEY: !Ref SecretKey
        SERP_API_KEY: !Ref SerpApiKey
        WHATSAPP_TOKEN: !Ref WhatsappToken
        WHATSAPP_PHONE_ID: !Ref WhatsappPhoneId
        WHATSAPP_VERIFY_TOKEN: !Ref WhatsappVerifyToken
        OPENCLAW_URL: !Ref OpenclawUrl
        MCP_SERVERS: !Ref McpServers
        GITHUB_CLIENT_ID: !Ref GithubClientId
        GITHUB_CLIENT_SECRET: !Ref GithubClientSecret
        GITLAB_CLIENT_ID: !Ref GitlabClientId
        GITLAB_CLIENT_SECRET: !Ref GitlabClientSecret
        PUBLIC_API_URL: !Ref PublicApiUrl

Resources:
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: semblance-chat
      CodeUri: ./
      Handler: run.sh
      # Runs directly under uvicorn via AWS Lambda Web Adapter, in
      # RESPONSE_STREAM invoke mode. A plain Function URL only supports
      # InvokeMode: BUFFERED behind a Mangum-wrapped ASGI handler — the
      # whole response gets collected before any of it reaches the client,
      # so /chat's StreamingResponse (gateway/router.py) never actually
      # streamed to the browser. The Web Adapter runs the app as a real
      # long-lived HTTP server behind Lambda's native streaming invoke API
      # instead, so chunks flush as Groq produces them. (This used to be
      # the Description field below, but AWS::Lambda::Function.Description
      # has a hard 256-char limit — CFN's early-validation hook was
      # correctly rejecting it at 622 chars, not a false positive.)
      Description: Light tier — FastAPI (chat/status/webhooks) via uvicorn + AWS Lambda Web Adapter, RESPONSE_STREAM invoke mode
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:28
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8000"
      FunctionUrlConfig:
        AuthType: NONE      # app-level auth via x-api-key (see gateway/router.py)
        InvokeMode: RESPONSE_STREAM
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable

  ChatFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatFunction}
      RetentionInDays: 14  # Lambda's auto-created log group defaults to "never expire" — a slow, silent cost creep otherwise

  TickFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: semblance-tick
      CodeUri: ./
      Handler: tick_handler.handler
      Description: Medium tier — one KAIROS tick per schedule firing, replacing the Heavy-tier daemon loop
      Timeout: 20
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
      Events:
        ScheduledTick:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Enabled: true

  TickFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TickFunction}
      RetentionInDays: 14

  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: semblance-cache
      BillingMode: PAY_PER_REQUEST  # traffic is tiny for one user; on-demand costs fractions of a cent/month
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ChatFunctionUrl:
    Description: Public HTTPS endpoint for the chat API — set as VITE_API_URL in the frontend
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  TickFunctionName:
    Value: !Ref TickFunction
  CacheTableName:
    Value: !Ref CacheTable
