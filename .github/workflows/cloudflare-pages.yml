name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: ["claude/bold-hawking-8o28g3"]
    paths: ["frontend/**", ".github/workflows/cloudflare-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.SEMBLANCE_API_URL }}
        run: npm run build

      - name: Verify baked API URL
        # Vite inlines VITE_API_URL as a literal string at build time — this
        # confirms what's actually in the shipped bundle rather than trusting
        # the secret is set/correct. Not sensitive: the Lambda Function URL
        # is already a public, unauthenticated-by-network endpoint.
        working-directory: frontend
        run: |
          found=$(grep -o 'https://[a-zA-Z0-9.-]*\.on\.aws' dist/assets/*.js || true)
          if [ -z "$found" ]; then
            echo "::error::No lambda-url.*.on.aws string found in the built bundle — VITE_API_URL secret is likely empty or unset, so API calls will hit a relative/wrong URL"
            grep -o 'fetch(\`\${[a-zA-Z0-9_$]*}/auth/login\`)' dist/assets/*.js || true
            exit 1
          fi
          echo "Baked API URL: $found"

      - name: Deploy to Cloudflare Pages
        # cloudflare/pages-action@v1 calls the deprecated `wrangler pages
        # publish` internally regardless of the wranglerVersion input (its
        # own deprecation warning confirms this) — every deploy landed as a
        # hash-prefixed preview under both wrangler 2 and 3 through this
        # action, despite production_branch being confirmed "main" via the
        # Cloudflare API and --branch=main being passed correctly either
        # way. Calling the modern, non-deprecated `wrangler pages deploy`
        # directly instead of going through the action.
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy dist --project-name=semblance --branch=main

      - name: Check the stable production subdomain
        # Every wrangler deploy prints its own permanent per-deployment URL
        # regardless of production/preview status — that's not necessarily
        # evidence the bare project subdomain (no hash) isn't already being
        # kept in sync. Checking it directly, and comparing the JS asset
        # filename (content-hashed by Vite) against what this build just
        # produced, to see whether it's actually serving the latest build.
        working-directory: frontend
        run: |
          echo "--- local dist/assets ---"
          ls dist/assets/
          echo "--- what semblance-773.pages.dev serves ---"
          curl -s https://semblance-773.pages.dev/ | grep -o 'assets/index-[a-zA-Z0-9]*\.js' || true
