name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: ["claude/bold-hawking-8o28g3"]
    paths: ["frontend/**", ".github/workflows/cloudflare-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.SEMBLANCE_API_URL }}
        run: npm run build

      - name: Verify baked API URL
        # Vite inlines VITE_API_URL as a literal string at build time — this
        # confirms what's actually in the shipped bundle rather than trusting
        # the secret is set/correct. Not sensitive: the Lambda Function URL
        # is already a public, unauthenticated-by-network endpoint.
        working-directory: frontend
        run: |
          found=$(grep -o 'https://[a-zA-Z0-9.-]*\.on\.aws' dist/assets/*.js || true)
          if [ -z "$found" ]; then
            echo "::error::No lambda-url.*.on.aws string found in the built bundle — VITE_API_URL secret is likely empty or unset, so API calls will hit a relative/wrong URL"
            grep -o 'fetch(\`\${[a-zA-Z0-9_$]*}/auth/login\`)' dist/assets/*.js || true
            exit 1
          fi
          echo "Baked API URL: $found"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: semblance
          directory: frontend/dist
          # The action labels a deploy "production" (stable
          # semblance-773.pages.dev URL) vs "preview" (a new
          # <commit-hash>.semblance-773.pages.dev URL every time) based on
          # whether this branch name matches the Pages project's configured
          # production branch — it defaults to the actual git branch
          # (claude/bold-hawking-8o28g3), which doesn't match, hence a fresh
          # preview URL on every deploy so far. Forcing it to the project's
          # production branch name here.
          branch: main
