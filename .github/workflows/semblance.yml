name: SEMBLANCE CI/CD

on:
  push:
    branches: ["claude/bold-hawking-8o28g3"]
  pull_request:
    branches: ["claude/bold-hawking-8o28g3"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests/ -v --tb=short

  deploy:
    name: Deploy to AWS (SAM)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.ref == 'refs/heads/claude/bold-hawking-8o28g3' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (IAM user access key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: sam build
        run: sam build --use-container

      - name: sam deploy
        run: |
          sam deploy \
            --debug \
            --region "${{ secrets.AWS_REGION || 'eu-west-1' }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              GroqApiKey=${{ secrets.GROQ_API_KEY }} \
              NeonDatabaseUrl=${{ secrets.NEON_DATABASE_URL }} \
              ModalEmbeddingsUrl=${{ secrets.MODAL_EMBEDDINGS_URL }} \
              SecretKey=${{ secrets.SEMBLANCE_SECRET_KEY }} \
              SerpApiKey=${{ secrets.SERP_API_KEY }} \
              OpenclawUrl=${{ secrets.OPENCLAW_URL }}

      - name: Expire old build artifacts in the SAM deployment bucket
        # `sam deploy --resolve-s3` keeps every historical build zip forever
        # by default. Idempotent — re-applies the same 14-day expiry rule on
        # every deploy, matching the CloudWatch log retention in template.yaml,
        # so this bucket never becomes a slow, silent storage cost.
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name aws-sam-cli-managed-default \
            --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue" \
            --output text)
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "$BUCKET" \
            --lifecycle-configuration '{
              "Rules": [{
                "ID": "expire-old-build-artifacts",
                "Status": "Enabled",
                "Filter": {},
                "Expiration": {"Days": 14},
                "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 1}
              }]
            }'
