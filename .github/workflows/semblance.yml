name: SEMBLANCE CI/CD

on:
  push:
    branches: ["claude/bold-hawking-8o28g3"]
    paths-ignore: ["frontend/**", "docs/**", "**.md"]
  pull_request:
    branches: ["claude/bold-hawking-8o28g3"]
    paths-ignore: ["frontend/**", "docs/**", "**.md"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests/ -v --tb=short

  deploy:
    name: Deploy to AWS (SAM)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.ref == 'refs/heads/claude/bold-hawking-8o28g3' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (IAM user access key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify AWS SAM CLI
        # There was never anything to install: GitHub's ubuntu-latest runner
        # image ships AWS SAM CLI preinstalled (confirmed by the standalone
        # installer itself refusing to proceed — "Found preexisting AWS SAM
        # CLI installation: /usr/local/aws-sam-cli/current"). Both
        # `pip install aws-sam-cli` variants that hung 5 runs in a row were
        # redundant work fighting PyPI reachability for a tool already on
        # the runner; this just confirms it's there.
        run: sam --version

      - name: sam build
        # --use-container builds inside a Docker container matching the
        # Lambda runtime — needed when the machine building doesn't match
        # that runtime (e.g. an arm64 dev laptop targeting x86_64 Lambda).
        # That's not the case here: the runner is already x86_64 Linux via
        # actions/setup-python, the same architecture template.yaml targets
        # (Architectures: [x86_64]), so there's nothing left to cross-build
        # for — only a Docker image pull to hang on, which it just did.
        run: sam build

      - name: sam deploy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MODAL_EMBEDDINGS_URL: ${{ secrets.MODAL_EMBEDDINGS_URL }}
          SEMBLANCE_SECRET_KEY: ${{ secrets.SEMBLANCE_SECRET_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          OPENCLAW_URL: ${{ secrets.OPENCLAW_URL }}
        run: |
          # Secrets go through env vars (not string-interpolated straight into
          # the script) and get trimmed + individually quoted below. Directly
          # interpolating ${{ secrets.X }} unquoted into a multi-line shell
          # command — the previous version of this step — meant a secret with
          # so much as a trailing newline (a common copy-paste artifact, e.g.
          # from a database dashboard's "connection string" field) silently
          # truncated the whole command: everything after the newline became
          # a separate, harmless no-op shell statement instead of erroring,
          # so sam deploy "succeeded" while quietly deploying nothing.
          groq_api_key=$(printf '%s' "$GROQ_API_KEY" | tr -d '\r\n')
          neon_database_url=$(printf '%s' "$NEON_DATABASE_URL" | tr -d '\r\n')
          modal_embeddings_url=$(printf '%s' "$MODAL_EMBEDDINGS_URL" | tr -d '\r\n')
          secret_key=$(printf '%s' "$SEMBLANCE_SECRET_KEY" | tr -d '\r\n')
          serp_api_key=$(printf '%s' "$SERP_API_KEY" | tr -d '\r\n')
          openclaw_url=$(printf '%s' "$OPENCLAW_URL" | tr -d '\r\n')

          # sam deploy's --parameter-overrides shorthand rejects "Key=" with a
          # truly empty value ("not a valid format") — so optional params that
          # are unset get left out entirely rather than passed as empty; the
          # template's own Default: "" covers them the same way either way.
          #
          # GroqModel/GroqPlanningModel are passed explicitly, always, even
          # though they're not secrets — CloudFormation reuses a parameter's
          # *previous deployed value* for any parameter omitted from
          # --parameter-overrides on a stack update, not the template's
          # current Default. Two model-ID fixes both silently no-op'd for
          # exactly this reason before this was caught. Keep these two
          # literal values in sync with the Default: in template.yaml.
          params=(
            "GroqApiKey=${groq_api_key}"
            "NeonDatabaseUrl=${neon_database_url}"
            "SecretKey=${secret_key}"
            "GroqModel=qwen/qwen3.8-27b"
            "GroqPlanningModel=openai/gpt-oss-120b"
          )
          [ -n "$modal_embeddings_url" ] && params+=("ModalEmbeddingsUrl=${modal_embeddings_url}")
          [ -n "$serp_api_key" ] && params+=("SerpApiKey=${serp_api_key}")
          [ -n "$openclaw_url" ] && params+=("OpenclawUrl=${openclaw_url}")

          sam deploy \
            --debug \
            --region "${{ secrets.AWS_REGION || 'eu-west-1' }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${params[@]}"

      - name: Diagnose changeset failure
        if: failure()
        run: |
          region="${{ secrets.AWS_REGION || 'eu-west-1' }}"
          echo "--- list-change-sets ---"
          aws cloudformation list-change-sets --stack-name semblance --region "$region" || true
          latest=$(aws cloudformation list-change-sets --stack-name semblance --region "$region" \
            --query 'reverse(sort_by(Summaries, &CreationTime))[0].ChangeSetId' --output text 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "None" ]; then
            echo "--- describe-change-set: $latest ---"
            aws cloudformation describe-change-set --stack-name semblance --region "$region" --change-set-name "$latest" || true
          fi
          echo "--- describe-stack-events (last 10) ---"
          aws cloudformation describe-stack-events --stack-name semblance --region "$region" --max-items 10 || true
          echo "--- describe-events (last 20; covers real stack operations only, not failed changeset creation) ---"
          aws cloudformation describe-events --stack-name semblance --region "$region" --max-items 20 || true

      - name: Expire old build artifacts in the SAM deployment bucket
        # `sam deploy --resolve-s3` keeps every historical build zip forever
        # by default. Idempotent — re-applies the same 14-day expiry rule on
        # every deploy, matching the CloudWatch log retention in template.yaml,
        # so this bucket never becomes a slow, silent storage cost.
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name aws-sam-cli-managed-default \
            --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue" \
            --output text)
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "$BUCKET" \
            --lifecycle-configuration '{
              "Rules": [{
                "ID": "expire-old-build-artifacts",
                "Status": "Enabled",
                "Filter": {},
                "Expiration": {"Days": 14},
                "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 1}
              }]
            }'

      - name: Smoke test deployed endpoint
        # Confirms the Function URL is actually serving the FastAPI app after
        # the switch to AWS Lambda Web Adapter (run.sh + RESPONSE_STREAM) —
        # a routing/startup regression there would silently 404 or hang
        # instead of failing the deploy itself, since CloudFormation only
        # checks that the *resources* converged, not that the app inside
        # answers correctly.
        run: |
          region="${{ secrets.AWS_REGION || 'eu-west-1' }}"
          url=$(aws cloudformation describe-stacks --stack-name semblance --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='ChatFunctionUrl'].OutputValue" --output text)
          url="${url%/}"

          echo "Testing $url/health"
          health_status=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" "$url/health")
          echo "status=$health_status body=$(cat /tmp/health_body.txt)"
          if [ "$health_status" != "200" ]; then
            echo "::error::/health returned $health_status, expected 200"
            exit 1
          fi

          echo "Testing POST $url/auth/login (expect 401, confirms routing works)"
          login_status=$(curl -s -o /tmp/login_body.txt -w "%{http_code}" -X POST "$url/auth/login" \
            -H "Content-Type: application/json" -d '{"passphrase":"__smoke_test_wrong__"}')
          echo "status=$login_status body=$(cat /tmp/login_body.txt)"
          if [ "$login_status" != "401" ]; then
            echo "::error::/auth/login returned $login_status, expected 401 (route may be missing/misconfigured)"
            exit 1
          fi
