name: SEMBLANCE CI/CD

on:
  push:
    branches: ["claude/bold-hawking-8o28g3"]
    paths-ignore: ["frontend/**", "docs/**", "**.md"]
  pull_request:
    branches: ["claude/bold-hawking-8o28g3"]
    paths-ignore: ["frontend/**", "docs/**", "**.md"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests/ -v --tb=short

  deploy:
    name: Deploy to AWS (SAM)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.ref == 'refs/heads/claude/bold-hawking-8o28g3' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (IAM user access key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify AWS SAM CLI
        # There was never anything to install: GitHub's ubuntu-latest runner
        # image ships AWS SAM CLI preinstalled (confirmed by the standalone
        # installer itself refusing to proceed — "Found preexisting AWS SAM
        # CLI installation: /usr/local/aws-sam-cli/current"). Both
        # `pip install aws-sam-cli` variants that hung 5 runs in a row were
        # redundant work fighting PyPI reachability for a tool already on
        # the runner; this just confirms it's there.
        run: sam --version

      - name: sam build
        # --use-container builds inside a Docker container matching the
        # Lambda runtime — needed when the machine building doesn't match
        # that runtime (e.g. an arm64 dev laptop targeting x86_64 Lambda).
        # That's not the case here: the runner is already x86_64 Linux via
        # actions/setup-python, the same architecture template.yaml targets
        # (Architectures: [x86_64]), so there's nothing left to cross-build
        # for — only a Docker image pull to hang on, which it just did.
        run: sam build

      - name: sam deploy
        # Falls back to the raw create-change-set/execute-change-set API with
        # --disable-validation, per explicit user decision (2026-09-14).
        # CloudFormation's new pre-deployment "early validation" hook
        # (AWS::EarlyValidation::PropertyValidation, GA'd Nov 2025) rejects
        # this stack's ChatFunction changes — the Layers/Environment/
        # FunctionUrlConfig needed for AWS Lambda Web Adapter response
        # streaming, copied verbatim from AWS's own documented example
        # (examples/fastapi-response-streaming-zip in
        # awslabs/aws-lambda-web-adapter) — with no per-property detail
        # obtainable: describe-change-set only repeats the generic message,
        # and neither describe-stack-events nor describe-events (confirmed
        # working, after granting the deploy IAM user
        # cloudformation:DescribeEvents) show anything either, because a
        # changeset that fails at creation time never becomes a stack
        # operation in the first place. Early validation already has a
        # documented false-positive class on other resource types for
        # intrinsic-function-resolved properties (e.g. API Gateway Models
        # flagged as JSONObject instead of the String a Ref resolves to) —
        # this reads as the same shape of bug hitting a newer resource
        # combination. Neither `sam deploy` nor `aws cloudformation deploy`
        # expose the CreateChangeSet API's own DisableValidation field, so
        # this step calls the raw API directly. --disable-validation
        # restores CloudFormation's pre-Nov-2025 behavior for this one
        # deploy: a genuinely broken template still fails, just at
        # deploy/runtime (CloudWatch) instead of at this new pre-flight
        # check.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MODAL_EMBEDDINGS_URL: ${{ secrets.MODAL_EMBEDDINGS_URL }}
          SEMBLANCE_SECRET_KEY: ${{ secrets.SEMBLANCE_SECRET_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          OPENCLAW_URL: ${{ secrets.OPENCLAW_URL }}
        run: |
          # Secrets go through env vars (not string-interpolated straight into
          # the script) and get trimmed + individually quoted below. Directly
          # interpolating ${{ secrets.X }} unquoted into a multi-line shell
          # command — an earlier version of this step — meant a secret with
          # so much as a trailing newline (a common copy-paste artifact, e.g.
          # from a database dashboard's "connection string" field) silently
          # truncated the whole command: everything after the newline became
          # a separate, harmless no-op shell statement instead of erroring,
          # so the deploy "succeeded" while quietly deploying nothing.
          groq_api_key=$(printf '%s' "$GROQ_API_KEY" | tr -d '\r\n')
          neon_database_url=$(printf '%s' "$NEON_DATABASE_URL" | tr -d '\r\n')
          modal_embeddings_url=$(printf '%s' "$MODAL_EMBEDDINGS_URL" | tr -d '\r\n')
          secret_key=$(printf '%s' "$SEMBLANCE_SECRET_KEY" | tr -d '\r\n')
          serp_api_key=$(printf '%s' "$SERP_API_KEY" | tr -d '\r\n')
          openclaw_url=$(printf '%s' "$OPENCLAW_URL" | tr -d '\r\n')

          region="${{ secrets.AWS_REGION || 'eu-west-1' }}"

          # GroqModel/GroqPlanningModel are passed explicitly, always, even
          # though they're not secrets — CloudFormation reuses a parameter's
          # *previous deployed value* for any parameter omitted from
          # --parameters on a stack update, not the template's current
          # Default. Two model-ID fixes both silently no-op'd for exactly
          # this reason before this was caught. Keep these two literal
          # values in sync with the Default: in template.yaml. Unlike
          # sam deploy's --parameter-overrides shorthand, the raw API
          # accepts an empty ParameterValue fine, so optional params are
          # always included explicitly (falling through to the template's
          # Default: only happens on stack *creation*, never on update).
          params=(
            "ParameterKey=GroqApiKey,ParameterValue=${groq_api_key}"
            "ParameterKey=NeonDatabaseUrl,ParameterValue=${neon_database_url}"
            "ParameterKey=SecretKey,ParameterValue=${secret_key}"
            "ParameterKey=GroqModel,ParameterValue=qwen/qwen3.8-27b"
            "ParameterKey=GroqPlanningModel,ParameterValue=openai/gpt-oss-120b"
            "ParameterKey=ModalEmbeddingsUrl,ParameterValue=${modal_embeddings_url}"
            "ParameterKey=SerpApiKey,ParameterValue=${serp_api_key}"
            "ParameterKey=OpenclawUrl,ParameterValue=${openclaw_url}"
          )

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name aws-sam-cli-managed-default \
            --region "$region" \
            --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue" \
            --output text)

          sam package \
            --region "$region" \
            --template-file .aws-sam/build/template.yaml \
            --s3-bucket "$BUCKET" \
            --output-template-file packaged.yaml

          if aws cloudformation describe-stacks --stack-name semblance --region "$region" >/dev/null 2>&1; then
            change_set_type=UPDATE
          else
            change_set_type=CREATE
          fi
          change_set_name="deploy-$(date +%s)"

          aws cloudformation create-change-set \
            --stack-name semblance \
            --region "$region" \
            --change-set-name "$change_set_name" \
            --change-set-type "$change_set_type" \
            --template-body file://packaged.yaml \
            --capabilities CAPABILITY_IAM \
            --disable-validation \
            --parameters "${params[@]}"

          if ! aws cloudformation wait change-set-create-complete \
              --stack-name semblance --region "$region" --change-set-name "$change_set_name"; then
            reason=$(aws cloudformation describe-change-set --stack-name semblance --region "$region" \
              --change-set-name "$change_set_name" --query 'StatusReason' --output text)
            echo "Changeset did not complete: $reason"
            if [[ "$reason" == *"didn't contain changes"* || "$reason" == *"No updates are to be performed"* ]]; then
              echo "No changes to deploy — treating as success."
              aws cloudformation delete-change-set --stack-name semblance --region "$region" --change-set-name "$change_set_name"
              exit 0
            fi
            exit 1
          fi

          aws cloudformation execute-change-set \
            --stack-name semblance --region "$region" --change-set-name "$change_set_name"

          if [ "$change_set_type" = "CREATE" ]; then
            aws cloudformation wait stack-create-complete --stack-name semblance --region "$region"
          else
            aws cloudformation wait stack-update-complete --stack-name semblance --region "$region"
          fi

      - name: Diagnose changeset failure
        if: failure()
        run: |
          region="${{ secrets.AWS_REGION || 'eu-west-1' }}"
          echo "--- list-change-sets ---"
          aws cloudformation list-change-sets --stack-name semblance --region "$region" || true
          latest=$(aws cloudformation list-change-sets --stack-name semblance --region "$region" \
            --query 'reverse(sort_by(Summaries, &CreationTime))[0].ChangeSetId' --output text 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "None" ]; then
            echo "--- describe-change-set: $latest ---"
            aws cloudformation describe-change-set --stack-name semblance --region "$region" --change-set-name "$latest" || true
          fi
          echo "--- describe-stack-events (last 10) ---"
          aws cloudformation describe-stack-events --stack-name semblance --region "$region" --max-items 10 || true
          echo "--- describe-events (early-validation detail API) ---"
          aws cloudformation describe-events --stack-name semblance --region "$region" || true

      - name: Expire old build artifacts in the SAM deployment bucket
        # `sam deploy --resolve-s3` keeps every historical build zip forever
        # by default. Idempotent — re-applies the same 14-day expiry rule on
        # every deploy, matching the CloudWatch log retention in template.yaml,
        # so this bucket never becomes a slow, silent storage cost.
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name aws-sam-cli-managed-default \
            --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue" \
            --output text)
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "$BUCKET" \
            --lifecycle-configuration '{
              "Rules": [{
                "ID": "expire-old-build-artifacts",
                "Status": "Enabled",
                "Filter": {},
                "Expiration": {"Days": 14},
                "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 1}
              }]
            }'
